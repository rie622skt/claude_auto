name: Deploy web to GitHub Pages

# Builds the Expo web export and publishes it to GitHub Pages.
# Enable it once in the repo: Settings -> Pages -> Source: "GitHub Actions".
# The base path (e.g. /claude_auto for a project site) is injected at build time,
# so the committed app.json stays root-relative and also works on Vercel/Netlify.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci || npm install

      - name: Inject Pages base path into app.json
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node -e "const fs=require('fs');const p='app.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));const base=(process.env.BASE_PATH||'').replace(/\/$/,'');c.expo.experiments={...(c.expo.experiments||{}),baseUrl:base};fs.writeFileSync(p,JSON.stringify(c,null,2));console.log('Injected baseUrl =',JSON.stringify(base));"

      - name: Export web bundle
        run: npx expo export --platform web

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
